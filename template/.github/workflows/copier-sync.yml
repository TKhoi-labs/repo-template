---
# Scheduled template sync: opens a pull request when the pinned template
# version moves.
#
# Actions are pinned to commit SHAs, not mutable tags: a tag can be moved to
# point at different code after review (ADR-0009). The trailing version
# comment is what Renovate reads when updating the pin.
#
# The token MUST be a GitHub App installation token or a PAT, never the default
# GITHUB_TOKEN. Pull requests opened with GITHUB_TOKEN do not trigger CI, so
# branch protection would block the sync PR forever.
#
# An installation token cannot be stored as a repository secret: it expires
# after one hour. It is minted per run from the app id and private key instead.
#
# Upgrading THIS file is a special case. The token scoping below decides whether
# the sync may write workflow files at all, so a repository running an older copy
# whose token was scoped too narrowly cannot receive a workflow change through
# the sync:
#
#   refusing to allow a GitHub App to create or update workflow
#   `.github/workflows/x.yml` without `workflows` permission
#
# Such a repository must be brought forward once by hand:
#
#   copier update --defaults --trust
#
# Pre-applying the change by hand does NOT help: Copier applies the template's
# diff as a patch, so a file that already carries the new content in the patched
# region makes the patch fail to apply, and the sync reports a conflict on a file
# that is in fact correct.
name: copier-sync

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {} # the job below declares exactly what it needs

# Never let two syncs race for the same branch.
concurrency:
  group: copier-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync with the template
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the sync branch
      pull-requests: write # open and update the sync pull request
    # Rollout switch. Unset means enabled. Set the repository variable
    # COPIER_SYNC_ENABLED to "false" to pause syncing for this repository;
    # manual runs still proceed, so a paused repository can be synced
    # deliberately.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      vars.COPIER_SYNC_ENABLED != 'false'
    steps:
      # persist-credentials: false keeps the job's GITHUB_TOKEN out of the
      # local git config, where later steps could leak it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Copier is pinned exactly. It renders the pull request, so a different
      # version could produce diffs unrelated to the template change and make
      # every sync PR unreviewable.
      - name: Install copier
        run: pipx install "copier==9.18.2"

      # --conflict=rej writes unresolvable hunks to .rej files rather than
      # leaving merge markers in the files. A diverged repository must fail the
      # sync, never produce a silently wrong merge.
      - name: Update from the pinned template version
        run: copier update --defaults --trust --conflict=rej

      - name: Fail if the template conflicted
        run: |
          conflicts="$(find . -name '*.rej' -not -path './.git/*')"
          if [ -n "$conflicts" ]; then
            echo "::error title=Template sync conflicted::Repository has diverged."
            printf '%s\n' "$conflicts"
            echo "Generated files are never hand-edited."
            echo "Move the change out of a generated path, then re-run this workflow."
            exit 1
          fi

      # Installation access tokens expire after one hour, so this cannot be a
      # repository secret. Only the private key is secret; the app id is a
      # variable. Scoped to the repository being synced rather than the whole
      # organisation, so a leaked token reaches one repository, not all of them.
      - name: Mint an installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.COPIER_SYNC_APP_ID }}
          private-key: ${{ secrets.COPIER_SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          # Without these the minted token inherits every permission the
          # installation holds (zizmor: github-app). These three are what
          # create-pull-request needs. `workflows` is not optional: the sync
          # commits template changes to .github/workflows/, and GitHub refuses
          # that push without it:
          #
          #   refusing to allow a GitHub App to create or update workflow
          #   `.github/workflows/x.yml` without `workflows` permission
          #
          # Scoping the token to contents + pull-requests alone therefore breaks
          # the sync on exactly the changes a template makes most often. The
          # rejection names the App permission rather than the token's, which
          # makes it easy to misdiagnose.
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Open a pull request
        # peter-evans/create-pull-request rather than `gh pr create`, which
        # zizmor suggests at low confidence: this action is a no-op when there
        # is nothing to sync and updates an existing pull request instead of
        # failing, which is what makes a re-run safe.
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          # The app token, never GITHUB_TOKEN: a pull request opened with
          # GITHUB_TOKEN triggers no workflows, so required checks never report
          # and branch protection blocks the sync forever.
          token: ${{ steps.app-token.outputs.token }}
          branch: chore/copier-sync
          delete-branch: true
          labels: template-sync
          title: "chore: sync with the repository template"
          commit-message: "chore: sync with the repository template"
          body: |
            Automated `copier update` against the template version pinned in
            `.copier-answers.yml`.

            Generated files are never hand-edited, so a conflict here means this
            repository has diverged from the template. Resolve it by moving the
            change out of a generated path.

            Because `.github/settings.yml` is a file, merging this pull request
            also applies any label or branch-protection changes to this
            repository through the Settings app.

      # Opt in per repository with the variable COPIER_SYNC_AUTO_MERGE=true.
      #
      # PREREQUISITE: `gh pr merge --auto` merges as soon as required checks
      # pass and required approvals are met. `.github/settings.yml` ships
      # `required_status_checks: null`, so with no required checks and
      # `contributing` off (zero required approvals) this merges IMMEDIATELY
      # rather than on green. Configure the required status checks first.
      # See docs/validation-runbook.md section 5.1.
      - name: Enable auto-merge on green
        if: >-
          steps.pr.outputs.pull-request-number &&
          vars.COPIER_SYNC_AUTO_MERGE == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # Passed through the environment rather than interpolated into the
          # script body: ${{ }} inside `run:` is expanded before the shell sees
          # it, which is a template-injection path for untrusted values.
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        run: gh pr merge --auto --squash "$PR_NUMBER"
