---
# Copier questionnaire for repo-template.
#
# The rendered payload lives in template/ (see docs/adr/0002). Everything
# outside template/ is template tooling and is never rendered into a repo.
#
# Module prompts encode the condition from the architecture design. Enable a
# module only when its condition is true: a module with no trigger is
# maintenance you now own.

_min_copier_version: "9.0.0"
_subdirectory: template
_answers_file: .copier-answers.yml
_envops:
  keep_trailing_newline: true
  undefined: jinja2.StrictUndefined

# ---------------------------------------------------------------------------
# Identity
# ---------------------------------------------------------------------------

project_name:
  type: str
  help: Human-readable project name.
  default: "{{ _copier_conf.dst_path.name }}"

project_slug:
  type: str
  help: Lowercase hyphenated slug, used for repository and artifact names.
  default: "{{ project_name | lower | replace(' ', '-') }}"
  validator: >-
    {% if not (project_slug | regex_search('^[a-z][a-z0-9-]*$')) %}
    Use lowercase letters, digits and hyphens, starting with a letter.
    {% endif %}

description:
  type: str
  help: One-line description of what this repository is for.
  default: ""

org_slug:
  type: str
  help: GitHub org or user that owns this repo and the shared .github repo.
  default: ""

workflow_ref:
  type: str
  help: >-
    Full 40-character commit SHA of the shared org .github workflow that
    ci.yml calls. Get it with:
    gh api repos/<org>/.github/commits/main --jq .sha
    A tag is deliberately not accepted (ADR-0009): a mutable ref can be
    repointed at different code after review, and the caller runs in every
    repository.
  default: ""
  validator: >-
    {% if workflow_ref and not (workflow_ref | regex_search('^[0-9a-f]{40}$')) %}
    workflow_ref must be a full 40-character lowercase commit SHA, not a tag.
    {% endif %}

license:
  type: str
  help: >-
    License for this repository. "Proprietary" renders an
    all-rights-reserved notice; "None" ships no LICENSE file.
  choices:
    - MIT
    - Proprietary
    - "None"
  default: MIT

copyright_holder:
  type: str
  help: Copyright holder named in the LICENSE file.
  default: "{{ org_slug }}"
  when: "{{ license != 'None' }}"

license_year:
  type: int
  help: Copyright year named in the LICENSE file.
  default: 2026
  when: "{{ license != 'None' }}"

# ---------------------------------------------------------------------------
# Modules
#
# Order matters: a question's validator can only see answers already given, so
# ci is asked before the modules that depend on it.
# ---------------------------------------------------------------------------

module_commits:
  type: bool
  help: >-
    commits — enforce Conventional Commits with commitlint?
    (condition: you want enforced history)
  default: true

module_ci:
  type: bool
  help: >-
    ci — add CI as a thin caller of the shared reusable workflow?
    (condition: any automated check)
  default: true
  validator: >-
    {% if module_ci and not org_slug %}
    module_ci requires org_slug: ci.yml calls a workflow in your org .github repo.
    {% endif %}
    {% if module_ci and not (workflow_ref | regex_search('^[0-9a-f]{40}$')) %}
    module_ci requires workflow_ref to be a full 40-character commit SHA.
    {% endif %}

module_deps:
  type: bool
  help: >-
    deps — Renovate plus dependency review?
    (condition: the repo has any dependency)
  default: true

module_docs:
  type: bool
  help: >-
    docs — architecture notes and the ADR index?
    (condition: architecture exists)
  default: false

module_contributing:
  type: bool
  help: >-
    contributing — CONTRIBUTING, CODEOWNERS and settings hardening?
    (condition: you accept outside contributions)
  default: false

module_env:
  type: bool
  help: >-
    env — devcontainer for reproducible local tooling?
    (condition: contributors need a reproducible environment)
  default: false

module_security:
  type: bool
  help: >-
    security — gitleaks and OpenSSF Scorecard?
    (condition: public repo or external users) REQUIRES ci
  default: false
  validator: >-
    {% if module_security and not module_ci %}
    module_security requires module_ci: the security workflows are CI jobs.
    {% endif %}

module_release:
  type: bool
  help: >-
    release — git-cliff release notes and a release workflow?
    (condition: you publish a versioned artifact) REQUIRES ci
  default: false
  validator: >-
    {% if module_release and not module_ci %}
    module_release requires module_ci: the release workflow is a CI job.
    {% endif %}

module_ops:
  type: bool
  help: >-
    ops — runbooks and observability config?
    (condition: the repo is deployed or running) REQUIRES ci
  default: false
  validator: >-
    {% if module_ops and not module_ci %}
    module_ops requires module_ci: deploy pipelines are CI jobs.
    {% endif %}

# CODEOWNERS cannot be derived, and it cannot be defaulted either. A valid owner
# is a team or a user with write access, an organisation handle is not an owner
# at all, and a personal account has no teams — so every non-empty default is
# wrong for some account. Empty generates no CODEOWNERS file, which is the only
# state that is correct for both.
codeowners_team:
  type: str
  help: >-
    Owner for .github/CODEOWNERS, or empty for no CODEOWNERS file. A valid
    owner is a visible team with write access ("@acme/maintainers") or a user
    with write access ("@alice"). An organisation handle on its own is not a
    valid owner, and a personal account has no teams, so a personal repository
    normally leaves this empty.
  default: ""
  when: "{{ module_contributing }}"

# ---------------------------------------------------------------------------
# Migrations
#
# `copier update --defaults` never re-asks a question, so a changed answer has to
# be written into .copier-answers.yml explicitly. This is how a new shared
# workflow SHA reaches repositories that already exist: changing a default here
# would do nothing for them (ADR-0009).
#
# `before:` runs before rendering, which is what makes the new value visible to
# .github/workflows/ci.yml in the same update. Entries are plain command
# strings, never mappings. The mechanism is verified in scripts/test-matrix.sh.
# ---------------------------------------------------------------------------

_migrations:
  # Roll the org shared-workflow pin forward. The replacement applies whatever
  # the previous value was: an org has one shared workflow, so every repository
  # should record the same SHA after this runs.
  - version: v0.3.0
    before:
      - >-
        sed -i "s|^workflow_ref:.*|workflow_ref:
        a58db51b34c18a01397838acdd4e9d6ac93f5f32|" .copier-answers.yml
